<!DOCTYPE html>
<html lang="en">
<head>
<title>Shipment Management</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
<script src="https://login2explore.com/jpdb/resources/js/0.0.3/jpdb-commons.js"></script>
<script src="js/index.js"></script>
</head>
<body>
<div class="container">
<h2>Shipment Management Form</h2>
<form id="shipmentForm" method="post">
  <div class="form-group">
    <span><label for="shipmentNo">Shipment No:</label> <label id="shipmentNoMsg"></label></span>
    <input type="text" class="form-control" name="shipmentNo" id="shipmentNo" placeholder="Enter Shipment No">
  </div>
  <div class="form-group">
    <label for="desc">Description:</label>
    <input type="text" class="form-control" id="desc" placeholder="Enter Description" name="desc" disabled>
  </div>
  <div class="form-group">
    <label for="source">Source:</label>
    <input type="text" class="form-control" id="source" placeholder="Enter Source" name="source" disabled>
  </div>
  <div class="form-group">
    <label for="destination">Destination:</label>
    <input type="text" class="form-control" id="destination" placeholder="Enter Destination" name="destination" disabled>
  </div>
  <div class="form-group">
    <label for="shippingDate">Shipping Date:</label>
    <input type="date" class="form-control" id="shippingDate" name="shippingDate" disabled>
  </div>
  <div class="form-group">
    <label for="expectedDeliveryDate">Expected Delivery Date:</label>
    <input type="date" class="form-control" id="expectedDeliveryDate" name="expectedDeliveryDate" disabled>
  </div>
  <input type="button" class="btn btn-primary" id="saveBtn" value="Save" onclick="saveData();" disabled>
  <input type="button" class="btn btn-warning" id="updateBtn" value="Update" onclick="updateData();" disabled>
  <input type="button" class="btn btn-default" id="resetBtn" value="Reset" onclick="resetForm();" disabled>
</form>
</div>
</body>
</html>
